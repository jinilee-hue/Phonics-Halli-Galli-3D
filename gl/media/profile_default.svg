<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 기본 프로필 그림 (반 기록 연동 전까지 쓰는 자리 그림) — 아이 얼굴 · 클레이 느낌. 실제 프로필 그림으로 바꾸려면 이 파일만 바꾸세요 -->
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#EEF5FF"/><stop offset=".6" stop-color="#D3E3FF"/><stop offset="1" stop-color="#B7CCF6"/>
    </radialGradient>
    <radialGradient id="skin" cx="40%" cy="34%" r="72%">
      <stop offset="0" stop-color="#FFEBDD"/><stop offset=".62" stop-color="#FFD7BE"/><stop offset="1" stop-color="#F2B996"/>
    </radialGradient>
    <radialGradient id="hair" cx="40%" cy="22%" r="85%">
      <stop offset="0" stop-color="#8A5A43"/><stop offset=".55" stop-color="#6A4232"/><stop offset="1" stop-color="#4E2F24"/>
    </radialGradient>
    <radialGradient id="shirt" cx="40%" cy="10%" r="90%">
      <stop offset="0" stop-color="#A9BFFA"/><stop offset=".6" stop-color="#7D97EA"/><stop offset="1" stop-color="#5F79D2"/>
    </radialGradient>
    <clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <!-- 몸 (셔츠) -->
    <path d="M30 210 C34 168 62 150 100 150 C138 150 166 168 170 210 Z" fill="url(#shirt)"/>
    <path d="M84 150 Q100 166 116 150" fill="none" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="5" stroke-linecap="round"/>
    <!-- 목 -->
    <path d="M88 132 L112 132 L114 154 Q100 162 86 154 Z" fill="#F2B996"/>
    <!-- 귀 -->
    <circle cx="51" cy="103" r="10" fill="#F7C6A6"/><circle cx="149" cy="103" r="10" fill="#F7C6A6"/>
    <!-- 뒷머리 -->
    <path d="M44 104 C40 58 66 34 100 34 C134 34 160 58 156 104 C152 92 148 84 144 80 L56 80 C52 84 48 92 44 104 Z" fill="url(#hair)"/>
    <!-- 얼굴 -->
    <circle cx="100" cy="100" r="49" fill="url(#skin)"/>
    <!-- 앞머리 -->
    <path d="M50 92 C48 62 70 42 100 42 C130 42 152 62 150 92 C144 78 134 70 124 68 C118 78 104 82 92 80 C80 79 70 74 66 68 C58 73 53 81 50 92 Z" fill="url(#hair)"/>
    <path d="M72 56 Q90 46 112 50" fill="none" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="5" stroke-linecap="round"/>
    <!-- 눈 · 반짝 -->
    <ellipse cx="82" cy="104" rx="6.6" ry="8.2" fill="#3A2722"/><ellipse cx="118" cy="104" rx="6.6" ry="8.2" fill="#3A2722"/>
    <circle cx="84.3" cy="100.6" r="2.4" fill="#FFFFFF"/><circle cx="120.3" cy="100.6" r="2.4" fill="#FFFFFF"/>
    <!-- 볼 -->
    <ellipse cx="70" cy="119" rx="9.5" ry="5.8" fill="#FF8E9B" fill-opacity=".55"/><ellipse cx="130" cy="119" rx="9.5" ry="5.8" fill="#FF8E9B" fill-opacity=".55"/>
    <!-- 입 -->
    <path d="M91 121 Q100 131 109 121" fill="none" stroke="#3A2722" stroke-width="4" stroke-linecap="round"/>
    <!-- 클레이 빛 -->
    <ellipse cx="78" cy="84" rx="15" ry="7" fill="#FFFFFF" fill-opacity=".22" transform="rotate(-20 78 84)"/>
  </g>
</svg>
